name: FlowGorila V6 - Reparacion integral

on:
  push:
    paths:
      - '.github/workflows/flowgorila-v6.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar V6 y consolidar archivos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          old_storage = '''const STORAGE_PREFIX = "flowgorila_v2_";
          const storage = {
            get(key, fallback) { try { const value = localStorage.getItem(STORAGE_PREFIX + key); return value === null ? fallback : JSON.parse(value); } catch { return fallback; } },
            set(key, value) { try { localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value)); } catch {} },
            clear() { try { Object.keys(localStorage).filter((key) => key.startsWith(STORAGE_PREFIX)).forEach((key) => localStorage.removeItem(key)); } catch {} }
          };'''
          new_storage = '''const ACTIVE_PROFILE = (() => {
            try { return localStorage.getItem("flowgorila_active_user") || "guest"; }
            catch { return "guest"; }
          })();
          const STORAGE_PREFIX = `flowgorila_v2_${ACTIVE_PROFILE}_`;
          const storage = {
            get(key, fallback) { try { const value = localStorage.getItem(STORAGE_PREFIX + key); return value === null ? fallback : JSON.parse(value); } catch { return fallback; } },
            set(key, value) { try { localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value)); } catch {} },
            clear() { try { Object.keys(localStorage).filter((key) => key.startsWith(STORAGE_PREFIX)).forEach((key) => localStorage.removeItem(key)); } catch {} }
          };'''
          if old_storage in app:
              app = app.replace(old_storage, new_storage, 1)
          elif 'const ACTIVE_PROFILE =' not in app:
              raise SystemExit('No se encontro el bloque de almacenamiento esperado en app.js')
          app_path.write_text(app, encoding='utf-8')

          css_sources = [
              'styles.css','roblox-games.css','nintendo.css','user-gallery.css','arcade-v3.css',
              'visual-upgrade.css','rbd.css','pokemon-gbc.css','flowgorila-media-20260814.css','flowgorila-v6.css'
          ]
          bundle = ['/* FlowGorila V6 bundle generado automaticamente. */\n']
          for source in css_sources:
              path = Path(source)
              if not path.exists(): raise SystemExit(f'Falta CSS requerido: {source}')
              text = path.read_text(encoding='utf-8')
              if source == 'rbd.css':
                  text = re.sub(r'^@import\s+url\([^\n]+\);\s*', '', text, count=1)
              bundle.append(f'\n/* ===== {source} ===== */\n{text}\n')
          Path('flowgorila-bundle-v6.css').write_text(''.join(bundle), encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          known_css = [
              'styles.css','roblox-games.css','nintendo.css','user-gallery.css','arcade-v3.css',
              'rbd.css','pokemon-gbc.css','flowgorila-media-20260814.css','flowgorila-v6.css','flowgorila-bundle-v6.css'
          ]
          for name in known_css:
              pattern = rf'^[ \t]*<link\s+rel="stylesheet"\s+href="{re.escape(name)}(?:\?[^\"]*)?">[ \t]*\n?'
              html = re.sub(pattern, '', html, flags=re.M)

          bundle_tag = '  <link rel="stylesheet" href="flowgorila-bundle-v6.css?v=6.0">'
          favicon = re.search(r'^[ \t]*<link\s+rel="icon"[^>]*>[ \t]*$', html, flags=re.M)
          if favicon:
              html = html[:favicon.end()] + '\n' + bundle_tag + html[favicon.end():]
          else:
              html = html.replace('</head>', bundle_tag + '\n</head>', 1)

          html = re.sub(r'^[ \t]*<script\s+defer\s+src="auth-v6\.js(?:\?[^\"]*)?"></script>[ \t]*\n?', '', html, flags=re.M)
          html = re.sub(r'^[ \t]*<script\s+defer\s+src="robustness-v6\.js(?:\?[^\"]*)?"></script>[ \t]*\n?', '', html, flags=re.M)

          app_pattern = r'^[ \t]*<script\s+defer\s+src="app\.js"></script>[ \t]*$'
          if not re.search(app_pattern, html, flags=re.M): raise SystemExit('No se encontro app.js en index.html')
          html = re.sub(app_pattern, '  <script defer src="auth-v6.js?v=6.0"></script>\n  <script defer src="app.js"></script>', html, count=1, flags=re.M)

          pokemon_pattern = r'^[ \t]*<script\s+defer\s+src="pokemon-gbc\.js(?:\?[^\"]*)?"></script>[ \t]*$'
          if re.search(pokemon_pattern, html, flags=re.M):
              html = re.sub(pokemon_pattern, lambda m: m.group(0).strip() + '\n  <script defer src="robustness-v6.js?v=6.0"></script>', html, count=1, flags=re.M)
          else:
              html = html.replace('</head>', '  <script defer src="robustness-v6.js?v=6.0"></script>\n</head>', 1)

          html = html.replace(
              'Noticias recientes enlazadas a publicaciones oficiales de Roblox. Verificadas el 5 de agosto de 2026.',
              'Archivo de novedades enlazado a publicaciones oficiales de Roblox. Las fechas corresponden a cada publicación.'
          )
          if '<body data-flowgorila-version="6">' not in html:
              html = html.replace('<body>', '<body data-flowgorila-version="6">', 1)
          index_path.write_text(html, encoding='utf-8')

          required = ['flowgorila-bundle-v6.css','auth-v6.js','app.js','pokemon-gbc.js','robustness-v6.js']
          for item in required:
              if not Path(item).exists(): raise SystemExit(f'Falta recurso V6: {item}')
          for section in ('rbd','juegos','roblox','nintendo','perfil'):
              count = html.count(f'id="{section}"')
              if count != 1: raise SystemExit(f'La seccion {section} aparece {count} veces')
          PY

      - name: Comprobar sintaxis JavaScript
        run: |
          node --check auth-v6.js
          node --check app.js
          node --check pokemon-gbc.js
          node --check robustness-v6.js

      - name: Comprobar recursos locales del HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          missing=[]
          for ref in re.findall(r'(?:src|href)="([^"#]+)"', html):
              ref=ref.split('?',1)[0]
              if ref.startswith(('http://','https://','mailto:','tel:','javascript:')): continue
              if ref and not Path(ref).exists(): missing.append(ref)
          if missing:
              print('Recursos locales ausentes:', sorted(set(missing)))
              raise SystemExit(1)
          print('OK: todos los recursos locales referenciados por index.html existen.')
          PY

      - name: Publicar V6
        run: |
          git config user.name "FlowGorila V6 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app.js flowgorila-bundle-v6.css
          git diff --cached --quiet && exit 0
          git commit -m "FlowGorila V6: perfiles, CSS consolidado y estabilidad"
          git pull --rebase origin main
          git push
