<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Cicocis Card Shop 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#101b2c;color:white;font:15px system-ui;overflow:hidden;touch-action:none}canvas{display:block}#hud{position:fixed;top:10px;left:10px;background:#14233cdd;padding:12px;border-radius:12px}#tip{position:fixed;bottom:125px;left:50%;transform:translateX(-50%);background:#14233cdd;border-radius:12px;padding:10px;text-align:center;white-space:nowrap}button{background:#3764bd;color:white;border:1px solid #9ac1ff77;border-radius:12px;padding:13px;font-weight:bold}#controls{position:fixed;bottom:12px;left:12px;display:grid;grid-template-columns:repeat(3,48px);gap:4px}#controls button:first-child{grid-column:2}#act{position:fixed;right:12px;bottom:12px;display:grid;gap:8px}#look{position:fixed;inset:0 0 0 45%}#dialog{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}#panel{background:#1c3050;border:1px solid #8eb9ff;border-radius:20px;padding:22px;max-width:340px;width:100%;text-align:center}#panel button{margin:5px}#start{position:fixed;inset:0;background:linear-gradient(130deg,#101d34,#375ca0);display:grid;place-content:center;text-align:center;padding:30px;z-index:10}#start h1{font-size:34px}#start button{font-size:18px}</style></head><body><div id="look"></div><div id="hud">💰 <b id="money"></b> &nbsp; 📦 <b id="packs"></b><br>🎴 Cartas: <b id="cards"></b> &nbsp; 🛒 Ventas: <b id="sales"></b></div><div id="tip">Explora la tienda</div><div id="controls"><button data-k="w">▲</button><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div><div id="act"><button id="use">✋ INTERACTUAR</button><button id="open">🎴 ABRIR SOBRE</button></div><div id="dialog"><div id="panel"><h2 id="title"></h2><p id="body"></p><button id="ok">Aceptar</button><button id="cancel">Cerrar</button></div></div><div id="start"><section><h1>🏪 CICOCIS CARD SHOP 3D</h1><p>Tu tienda de cartas en primera persona</p><p>Compra sobres, colecciona cartas y atiende clientes</p><button id="play">🎮 JUGAR</button><p>📱 Flechas + deslizar para mirar<br>💻 WASD + ratón</p></section></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>if(!window.THREE){alert('Necesitas conexión a internet para cargar el motor 3D');throw Error('Three.js unavailable')}const $=id=>document.getElementById(id),key='cicocis-shop-3d-v1';let s={money:250,packs:5,cards:[],sales:0,display:3};try{s={...s,...JSON.parse(localStorage.getItem(key))}}catch(e){}function update(){for(const k of ['money','packs','sales'])$(k).textContent=s[k];$('cards').textContent=s.cards.length;localStorage.setItem(key,JSON.stringify(s))}update();const scene=new THREE.Scene();scene.background=new THREE.Color(0x94b2d2);const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);cam.position.set(0,1.65,5);const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(ren.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x7d8397,2));let light=new THREE.DirectionalLight(0xffffff,1.7);light.position.set(3,7,3);scene.add(light);const mat=c=>new THREE.MeshStandardMaterial({color:c});function cube(x,y,z,w,h,d,c){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);scene.add(m)}cube(0,-.15,0,14,.3,14,0x707b8d);cube(0,2.5,-7,14,5,.2,0xd6dce8);cube(-7,2.5,0,.2,5,14,0xd6dce8);cube(7,2.5,0,.2,5,14,0xd6dce8);cube(0,5,0,14,.2,14,0xf4f2ed);cube(0,.8,-4.5,3,1.6,1.2,0x765039);cube(0,1.65,-4.5,3,.1,1.3,0xd2c6a5);cube(3,.7,3,2,1.4,1.5,0x395c9d);for(let x of [-5.6,5.6])for(let z of [-3,1]){cube(x,1.1,z,2.2,2.2,.7,0x6d4b36);for(let y of [.5,1.2,1.9]){cube(x,y,z+.4,2.4,.08,.9,0xc69b5d);for(let j=-1;j<=1;j++)cube(x+j*.65,y+.22,z+.35,.35,.4,.2,[0x4168a9,0xc64667,0xe9bd59][j+1])}}cube(-2,.9,3,.6,1.5,.45,0x3e679d);cube(-2,1.85,3,.45,.45,.45,0xe4ad86);const targets=[{x:0,z:-4.5,t:'Caja registradora',k:'counter'},{x:3,z:3,t:'Vitrina',k:'display'},{x:-2,z:3,t:'Cliente',k:'client'},...[-5.6,5.6].flatMap(x=>[-3,1].map(z=>({x,z,t:'Estantería',k:'shelf'})))];let yaw=0,pitch=0,held={},near=null,paused=false,started=false;function message(t,b,label,fn){paused=true;$('title').textContent=t;$('body').textContent=b;$('ok').textContent=label;$('dialog').style.display='flex';$('ok').onclick=()=>{fn();close()}}function close(){paused=false;$('dialog').style.display='none'}$('cancel').onclick=close;function action(){if(!near)return;if(near.k==='counter')message('📦 Proveedor','Compra 5 sobres por 60 monedas','Comprar',()=>{if(s.money>=60){s.money-=60;s.packs+=5;update()}else alert('Dinero insuficiente')});if(near.k==='shelf')message('🛍️ Reponer estantería','Sobres expuestos: '+s.display+' · Almacén: '+s.packs,'Reponer 1',()=>{if(s.packs>0){s.packs--;s.display++;update()}else alert('Sin sobres')});if(near.k==='client')message('🧍 Cliente','El cliente quiere comprar un sobre por 35 monedas. Expuestos: '+s.display,'Vender',()=>{if(s.display>0){s.display--;s.money+=35;s.sales++;update()}else alert('Repón la estantería')});if(near.k==='display')message('💎 Colección','Cartas: '+s.cards.map(c=>c.n).join(', ')+' · Valor: '+s.cards.reduce((a,c)=>a+c.v,0),'Vender última',()=>{let c=s.cards.pop();if(c){s.money+=c.v;update()}})}const pool=[['Flamín','🔥',20],['Aquafin','💧',22],['Florín','🌿',18],['Voltix','⚡',35],['Lunara','🌙',70],['Drakón','🐉',120]];function pack(){if(!s.packs)return alert('Compra más sobres en la caja');s.packs--;let r=Math.random(),i=r>.97?5:r>.85?4:r>.65?3:Math.floor(Math.random()*3),c=pool[i];s.cards.push({n:c[0],v:c[2]});update();message('🎴 '+c[1]+' '+c[0],'¡Nueva carta! Valor estimado: '+c[2]+' monedas','Genial',()=>{})}$('use').onclick=action;$('open').onclick=pack;$('play').onclick=()=>{started=true;$('start').style.display='none'};document.addEventListener('keydown',e=>{held[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e'&&!paused)action();if(e.key.toLowerCase()==='p'&&!paused)pack()});document.addEventListener('keyup',e=>held[e.key.toLowerCase()]=false);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{held[k]=true;b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>held[k]=false)});let lx=0,ly=0,touch=false;$('look').addEventListener('pointerdown',e=>{touch=true;lx=e.clientX;ly=e.clientY;$('look').setPointerCapture(e.pointerId)});$('look').addEventListener('pointermove',e=>{if(!touch)return;yaw-=(e.clientX-lx)*.005;pitch=Math.max(-.8,Math.min(.8,pitch-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY});$('look').addEventListener('pointerup',()=>touch=false);ren.domElement.onclick=()=>ren.domElement.requestPointerLock?.();document.addEventListener('mousemove',e=>{if(document.pointerLockElement===ren.domElement){yaw-=e.movementX*.0025;pitch=Math.max(-.8,Math.min(.8,pitch-e.movementY*.0025))}});let last=performance.now();function frame(now){requestAnimationFrame(frame);let dt=Math.min((now-last)/1000,.05);last=now;if(started&&!paused){let f=+(held.w||held.arrowup)-+(held.s||held.arrowdown),r=+(held.d||held.arrowright)-+(held.a||held.arrowleft),n=Math.hypot(f,r)||1;cam.position.x+=(Math.sin(yaw)*f+Math.cos(yaw)*r)*dt*3.5/n;cam.position.z+=(-Math.cos(yaw)*f+Math.sin(yaw)*r)*dt*3.5/n;cam.position.x=Math.max(-6.5,Math.min(6.5,cam.position.x));cam.position.z=Math.max(-6.5,Math.min(6.5,cam.position.z));cam.rotation.order='YXZ';cam.rotation.y=yaw;cam.rotation.x=pitch;near=null;let d=2.4;for(let t of targets){let a=Math.hypot(cam.position.x-t.x,cam.position.z-t.z);if(a<d){d=a;near=t}}$('tip').textContent=near?'✋ '+near.t+' · INTERACTUAR':'Acércate a un objeto para interactuar'}ren.render(scene,cam)}requestAnimationFrame(frame);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)})</script></body></html>
